<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Exams — Campus Memory</title>
<link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body>
<div id="cm-shell"></div>
<div id="cm-page-content">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
    <div><h1 style="font-size:24px;margin-bottom:2px">Exams</h1><p style="color:var(--text-muted)">Exams and vivas you've scheduled.</p></div>
    <button class="btn btn-primary" onclick="openForm()">+ New Exam</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px" id="e-grid"></div>
</div>

<div id="modal" class="overlay" style="display:none" onclick="if(event.target===this) closeForm()">
  <div class="modal">
    <div style="padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
      <b id="modal-title">New Exam</b><button class="btn btn-ghost btn-sm" onclick="closeForm()">✕</button>
    </div>
    <div style="padding:20px">
      <label class="field-label">Subject</label><select class="input" id="f-subject" style="margin-bottom:12px"></select>
      <label class="field-label">Type</label>
      <select class="input" id="f-type" style="margin-bottom:12px"><option>Internal Assessment</option><option>Viva</option><option>Class Test</option><option>Practical</option><option>Project Review</option></select>
      <label class="field-label">Date</label><input class="input" id="f-date" type="date" style="margin-bottom:12px"/>
      <label class="field-label">Time</label><input class="input" id="f-time" placeholder="10:00 AM" style="margin-bottom:12px"/>
      <label class="field-label">Room</label><input class="input" id="f-room" placeholder="Room 204" style="margin-bottom:12px"/>
      <label class="field-label">Topics (comma separated)</label><input class="input" id="f-topics" style="margin-bottom:16px"/>
      <input type="hidden" id="f-id"/>
      <button class="btn btn-primary" style="width:100%" onclick="saveExam()">Save Exam</button>
    </div>
  </div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ai.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  cmRenderShell({ active: "/faculty/exams.html", prefix: ".." });
  const facultyUser = cmCurrentUser();
  document.getElementById("f-subject").innerHTML = cmDB().subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join("");

  function render(){
    const mine = cmList("exams").filter(e=>e.faculty===facultyUser.name);
    document.getElementById("e-grid").innerHTML = mine.map(e => `
      <div class="card card-pad">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div style="font-weight:700">${cmSubject(e.subject).name} — ${e.type}</div>
          <div style="display:flex;gap:6px"><button class="icon-btn" onclick="editExam('${e.id}')">✎</button><button class="icon-btn danger" onclick="deleteExam('${e.id}')">🗑</button></div>
        </div>
        <div style="font-size:12.5px;color:var(--text-muted);margin:6px 0">${cmFmtDate(e.date)} · ${e.time} · ${e.room}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${(e.topics||[]).map(t=>`<span class="badge badge-neutral">${t}</span>`).join("")}</div>
      </div>`).join("") || `<div class="empty-state" style="grid-column:1/-1">No exams scheduled by you yet.</div>`;
  }
  function openForm(){
    document.getElementById("modal-title").textContent = "New Exam";
    ["f-date","f-time","f-room","f-topics","f-id"].forEach(id=>document.getElementById(id).value="");
    document.getElementById("modal").style.display = "flex";
  }
  function editExam(id){
    const e = cmGet("exams", id);
    document.getElementById("modal-title").textContent = "Edit Exam";
    document.getElementById("f-id").value = e.id;
    document.getElementById("f-subject").value = e.subject;
    document.getElementById("f-type").value = e.type;
    document.getElementById("f-date").value = e.date;
    document.getElementById("f-time").value = e.time;
    document.getElementById("f-room").value = e.room;
    document.getElementById("f-topics").value = (e.topics||[]).join(", ");
    document.getElementById("modal").style.display = "flex";
  }
  function closeForm(){ document.getElementById("modal").style.display = "none"; }
  function saveExam(){
    const id = document.getElementById("f-id").value;
    const payload = {
      subject: document.getElementById("f-subject").value,
      type: document.getElementById("f-type").value,
      date: document.getElementById("f-date").value,
      time: document.getElementById("f-time").value.trim(),
      room: document.getElementById("f-room").value.trim(),
      topics: document.getElementById("f-topics").value.split(",").map(t=>t.trim()).filter(Boolean),
      faculty: facultyUser.name,
    };
    if (!payload.date) { cmToast("Please choose a date", "error"); return; }
    if (id) { cmUpdate("exams", id, payload); cmToast("Exam updated"); }
    else { cmAdd("exams", payload); cmToast("Exam scheduled and published to Campus Memory"); }
    closeForm(); render();
  }
  function deleteExam(id){
    if (!confirm("Delete this exam?")) return;
    cmRemove("exams", id); cmToast("Exam deleted"); render();
  }
  render();
</script>
</body>
</html>
