<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Campus AI — Campus Memory</title>
<link rel="stylesheet" href="../assets/css/style.css"/>
<style>
  .chat-msg{max-width:80%;padding:12px 15px;border-radius:14px;font-size:13.5px;line-height:1.6;margin-bottom:14px}
  .chat-user{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;margin-left:auto;border-bottom-right-radius:4px}
  .chat-ai{background:var(--surface-2);border-bottom-left-radius:4px}
  .typing-dots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--text-muted);margin:0 1px;animation:blink 1.2s infinite}
  .typing-dots span:nth-child(2){animation-delay:.2s}.typing-dots span:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
</style>
</head>
<body>
<div id="cm-shell"></div>
<div id="cm-page-content">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:2px">
    <h1 style="font-size:24px">🧠 Campus AI</h1>
    <span class="badge" id="mode-badge"></span>
  </div>
  <p style="color:var(--text-muted);margin-bottom:18px">Ask anything about your academic memory. Answers are grounded in your actual Campus Memory data.</p>

  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px" id="suggestions"></div>

  <div class="card" style="display:flex;flex-direction:column;height:480px">
    <div id="chat-log" class="scrollbar-thin" style="flex:1;overflow-y:auto;padding:20px"></div>
    <div style="border-top:1px solid var(--border);padding:12px;display:flex;gap:8px">
      <input class="input" id="chat-input" placeholder="Ask Campus AI…" onkeydown="if(event.key==='Enter') sendChat()"/>
      <button class="btn btn-primary" onclick="sendChat()">Ask</button>
    </div>
  </div>
  <p style="font-size:11.5px;color:var(--text-muted);margin-top:10px">No API key saved yet? Campus AI still works fully offline using local grounded lookup. Add a key any time in <a href="./settings.html" style="color:var(--primary-2);font-weight:600">Settings</a> for real Claude responses.</p>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ai.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  cmRenderShell({ active: "/student/ai-assistant.html", prefix: ".." });
  const user = cmCurrentUser();

  function refreshModeBadge(){
    const hasKey = !!cmGetApiKey();
    document.getElementById("mode-badge").textContent = hasKey ? "✦ Live API mode" : "Local memory mode";
    document.getElementById("mode-badge").className = "badge " + (hasKey ? "badge-accent" : "badge-neutral");
  }
  refreshModeBadge();

  const suggestions = ["What's due this week?","Which exams are coming?","What did I miss yesterday?","What should I prioritize?","What's my attendance?"];
  document.getElementById("suggestions").innerHTML = suggestions.map(s => `<button class="btn btn-outline btn-sm" onclick="askSuggested('${s.replace(/'/g,"\\'")}')">${s}</button>`).join("");
  function askSuggested(s){ document.getElementById("chat-input").value = s; sendChat(); }

  function addMsg(role, html){
    const log = document.getElementById("chat-log");
    log.insertAdjacentHTML("beforeend", `<div class="chat-msg ${role==='user'?'chat-user':'chat-ai'}">${html}</div>`);
    log.scrollTop = log.scrollHeight;
    return log.lastElementChild;
  }

  addMsg("ai", `Hi ${user.name.split(" ")[0]} 👋 I'm Campus AI. I only answer using information stored in Campus Memory — ask me about deadlines, exams, attendance, or what you missed.`);

  function sendChat(){
    const input = document.getElementById("chat-input");
    const q = input.value.trim();
    if (!q) return;
    addMsg("user", q);
    input.value = "";
    const thinking = addMsg("ai", `<span class="typing-dots"><span></span><span></span><span></span></span>`);
    cmAskAI(q, (answer, source) => {
      thinking.innerHTML = answer;
      if (source === "live-api") thinking.insertAdjacentHTML("beforeend", `<div style="margin-top:8px"><span class="badge badge-accent">✦ Answered by live Claude API</span></div>`);
    });
  }
</script>
</body>
</html>
