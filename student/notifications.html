<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Notifications — Campus Memory</title>
<link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body>
<div id="cm-shell"></div>
<div id="cm-page-content">
  <h1 style="font-size:24px;margin-bottom:2px">Notifications</h1>
  <p style="color:var(--text-muted);margin-bottom:20px">Everything Campus Memory thinks you should know.</p>
  <div id="notif-list"></div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ai.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  cmRenderShell({ active: "/student/notifications.html", prefix: ".." });
  const priIcon = { critical: "🔴", important: "🟠", normal: "🔵" };
  const groups = { "Today": [], "Yesterday": [], "Earlier": [] };
  cmDB().notifications.forEach(n => {
    if (n.time.includes("hour")) groups["Today"].push(n);
    else if (n.time.includes("1 day")) groups["Yesterday"].push(n);
    else groups["Earlier"].push(n);
  });
  document.getElementById("notif-list").innerHTML = Object.keys(groups).map(g => groups[g].length ? `
    <div style="font-size:11.5px;font-weight:800;color:var(--text-muted);text-transform:uppercase;margin:18px 0 10px">${g}</div>
    ${groups[g].map(n => `<div class="card card-pad card-hover" style="margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;${n.read?'opacity:.65':''}">
      <span style="font-size:16px">${priIcon[n.priority]}</span>
      <div style="flex:1"><div style="font-weight:700;font-size:13.5px">${n.title}</div><div style="font-size:12.5px;color:var(--text-muted);margin-top:2px">${n.desc}</div></div>
      <div style="font-size:11px;color:var(--text-muted);white-space:nowrap">${n.time}</div>
    </div>`).join("")}` : "").join("") || `<div class="empty-state"><div class="icon-wrap">🔔</div>Nothing needs your attention right now.</div>`;
</script>
</body>
</html>
