<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Attendance — Campus Memory</title>
<link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body>
<div id="cm-shell"></div>
<div id="cm-page-content">
  <h1 style="font-size:24px;margin-bottom:2px">Attendance</h1>
  <p style="color:var(--text-muted);margin-bottom:20px">Configured threshold: <b id="threshold-label">75%</b></p>

  <div style="display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:start" id="att-layout"></div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ai.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  cmRenderShell({ active: "/student/attendance.html", prefix: ".." });
  const att = cmDB().attendance;
  document.getElementById("threshold-label").textContent = att.threshold + "%";

  function ring(pct, color, size){
    const r = (size-14)/2, c = 2*Math.PI*r;
    const off = c - (pct/100)*c;
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="10"/>
      <circle class="risk-ring" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
      <text x="50%" y="50%" text-anchor="middle" dy=".35em" font-size="20" font-weight="800" fill="var(--text)">${pct}%</text>
    </svg>`;
  }

  document.getElementById("att-layout").innerHTML = `
    <div class="card card-pad" style="text-align:center">
      <div class="field-label" style="text-align:center">Overall attendance</div>
      ${ring(att.overall, att.overall>=att.threshold?'var(--success)':'var(--warning)', 160)}
      <div style="font-size:12px;color:var(--text-muted);margin-top:8px">${att.overall>=att.threshold? '🟢 Healthy' : '🟡 Approaching threshold'}</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px" id="subj-cards"></div>
  `;

  document.getElementById("subj-cards").innerHTML = att.subjects.map(sa => {
    const s = cmSubject(sa.id);
    const status = sa.pct >= att.threshold + 5 ? {t:"🟢 Healthy", c:"success"} : sa.pct >= att.threshold ? {t:"🟡 Approaching threshold", c:"warning"} : {t:"🔴 Below threshold", c:"danger"};
    const missed = sa.total - sa.attended;
    // consecutive classes that can be missed while staying >= threshold, assuming ~2 classes/week remain (approx model)
    const futureClasses = 20;
    let canMiss = 0;
    for(let m=0;m<=futureClasses;m++){
      const projTotal = sa.total + futureClasses;
      const projAttended = sa.attended + (futureClasses-m);
      if ((projAttended/projTotal*100) >= att.threshold) canMiss = m; else break;
    }
    return `<div class="card card-pad card-hover">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <span style="font-weight:700;color:${s.color}">${s.name}</span>
        <span class="badge badge-${status.c}">${sa.pct}%</span>
      </div>
      <div class="progress-track" style="margin-bottom:10px"><div class="progress-fill" style="width:${sa.pct}%"></div></div>
      <div style="font-size:12px;color:var(--text-muted);display:flex;justify-content:space-between;margin-bottom:2px"><span>Classes attended</span><b style="color:var(--text)">${sa.attended}</b></div>
      <div style="font-size:12px;color:var(--text-muted);display:flex;justify-content:space-between;margin-bottom:8px"><span>Classes missed</span><b style="color:var(--text)">${missed}</b></div>
      <div style="font-size:11.5px;color:var(--text-muted)">${status.t}</div>
      <div style="font-size:11.5px;color:var(--text-muted);margin-top:6px">Can miss ~${canMiss} more upcoming classes and stay above ${att.threshold}%.</div>
    </div>`;
  }).join("");
</script>
</body>
</html>
