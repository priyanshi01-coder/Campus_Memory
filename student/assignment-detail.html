<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Assignment Detail — Campus Memory</title>
<link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body>
<div id="cm-shell"></div>
<div id="cm-page-content">
  <a href="./assignments.html" class="btn btn-ghost btn-sm" style="margin-bottom:14px">← Back to assignments</a>
  <div id="detail"></div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ai.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  cmRenderShell({ active: "/student/assignments.html", prefix: ".." });
  const id = new URLSearchParams(window.location.search).get("id") || "a1";
  const a = cmDB().assignments.find(x => x.id === id) || cmDB().assignments[0];
  const s = cmSubject(a.subject);
  const days = cmDaysUntil(a.deadline);

  document.getElementById("detail").innerHTML = `
    <div style="display:grid;grid-template-columns:2fr 1fr;gap:20px;align-items:start">
      <div>
        <div class="card card-pad" style="margin-bottom:18px">
          <span class="badge" style="background:${s.color}22;color:${s.color};margin-bottom:10px">${s.name}</span>
          <h1 style="font-size:22px;margin:4px 0 8px">${a.title}</h1>
          <div style="font-size:13px;color:var(--text-muted);margin-bottom:16px">${a.faculty} · Max marks: ${a.maxMarks}</div>
          <p style="line-height:1.7;font-size:14px">${a.instructions}</p>

          <div style="margin-top:18px">
            <div class="field-label">Topics covered</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">${a.topics.map(t=>`<span class="badge badge-neutral">${t}</span>`).join("")}</div>
          </div>

          <div style="margin-top:18px;display:flex;gap:10px;align-items:center;padding:12px;background:var(--surface-2);border-radius:10px">
            📎 <div><div style="font-weight:700;font-size:13.5px">${a.attachment}</div><div style="font-size:11.5px;color:var(--text-muted)">Submission: ${a.submissionMethod}</div></div>
            <button class="btn btn-outline btn-sm" style="margin-left:auto" onclick="cmToast('Downloading attachment…')">Download</button>
          </div>
        </div>

        <div class="card card-pad">
          <div class="field-label" style="margin-bottom:12px">Progress</div>
          <div style="position:relative;padding-left:30px">
            <div class="tl-line"></div>
            ${["Announced","Started","Due","Submitted"].map((step,i) => {
              const done = a.status==="submitted" ? true : i < (a.status==="in_progress"?2:1);
              return `<div style="position:relative;margin-bottom:16px">
                <div class="tl-dot" style="position:absolute;left:-24px;top:2px;background:${done?'var(--success)':'var(--border)'}"></div>
                <div style="font-weight:700;font-size:13.5px;${done?'':'color:var(--text-muted)'}">${step}</div>
              </div>`;
            }).join("")}
          </div>
        </div>
      </div>
      <div>
        <div class="card card-pad" style="margin-bottom:16px">
          <div class="field-label">Deadline</div>
          <div style="font-weight:800;font-size:18px;color:${days<=2?'var(--danger)':'var(--text)'}">${cmFmtDate(a.deadline)}</div>
          <div style="font-size:12.5px;color:var(--text-muted)">${days>=0?days+" days remaining":"Overdue"}</div>
          <div style="height:1px;background:var(--border);margin:14px 0"></div>
          <div class="field-label">Priority</div>
          <div style="font-weight:800;font-size:18px">${a.priority}/100</div>
          <div class="progress-track" style="margin-top:6px"><div class="progress-fill" style="width:${a.priority}%"></div></div>
          <div style="height:1px;background:var(--border);margin:14px 0"></div>
          <div class="field-label">Estimated effort</div>
          <div style="font-weight:700">${a.effortHrs} hours</div>
        </div>
        <div class="card card-pad">
          <div class="field-label">Class submission status</div>
          <div style="font-weight:800;font-size:18px;margin:4px 0">${a.submitted}/${a.total}</div>
          <div class="progress-track"><div class="progress-fill" style="width:${Math.round(a.submitted/a.total*100)}%"></div></div>
          <button class="btn btn-primary" style="width:100%;margin-top:16px" onclick="markProgress()" id="progress-btn">${a.status==='submitted'?'Submitted ✓':a.status==='in_progress'?'Mark as submitted':'Mark progress'}</button>
        </div>
      </div>
    </div>`;

  function markProgress(){
    let next = a.status === "pending" ? "in_progress" : "submitted";
    const patch = { status: next };
    if (next === "submitted") patch.submitted = a.submitted + 1;
    cmUpdate("assignments", a.id, patch);
    cmToast(next === "submitted" ? "Marked as submitted" : "Progress marked as in progress");
    window.location.reload();
  }
</script>
</body>
</html>
