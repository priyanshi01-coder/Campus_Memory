<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Knowledge Base — Campus Memory</title>
<link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body>
<div id="cm-shell"></div>
<div id="cm-page-content">
  <h1 style="font-size:24px;margin-bottom:2px">College Knowledge</h1>
  <p style="color:var(--text-muted);margin-bottom:20px">Institutional questions, answered — with clear source labels.</p>

  <input class="input" id="kb-search" placeholder="What do you need help with?" style="margin-bottom:16px;max-width:480px" oninput="renderKB()"/>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px" id="kb-cats"></div>
  <div id="kb-list"></div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ai.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  cmRenderShell({ active: "/student/knowledge-base.html", prefix: ".." });
  const trustMeta = {
    official: { label: "🟢 OFFICIAL", cls: "trust-official" },
    faculty: { label: "🔵 FACULTY VERIFIED", cls: "trust-faculty" },
    student: { label: "🟡 STUDENT EXPERIENCE", cls: "trust-student" },
  };
  const cats = ["All", ...new Set(cmDB().knowledgeBase.map(k => k.category))];
  let activeCat = "All";
  document.getElementById("kb-cats").innerHTML = cats.map(c => `<button class="btn btn-sm ${activeCat===c?'btn-primary':'btn-outline'}" data-c="${c}" onclick="setCat('${c}')">${c}</button>`).join("");
  function setCat(c){ activeCat=c; document.querySelectorAll("#kb-cats button").forEach(b=>b.className="btn btn-sm "+(b.dataset.c===c?'btn-primary':'btn-outline')); renderKB(); }

  function renderKB(){
    const q = document.getElementById("kb-search").value.toLowerCase();
    let items = cmDB().knowledgeBase.filter(k => (activeCat==="All"||k.category===activeCat) && (k.q.toLowerCase().includes(q)||k.a.toLowerCase().includes(q)));
    document.getElementById("kb-list").innerHTML = items.length ? items.map(k => {
      const t = trustMeta[k.trust];
      return `<details class="card card-pad" style="margin-bottom:12px">
        <summary style="cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px">
          <span>${k.q}</span><span class="trust-badge ${t.cls}" style="white-space:nowrap;margin-left:12px">${t.label}</span>
        </summary>
        <p style="margin-top:12px;font-size:13.5px;color:var(--text-muted);line-height:1.6">${k.a}</p>
        <div style="font-size:11px;color:var(--text-muted);margin-top:8px">Category: ${k.category}</div>
        ${k.trust==='student' ? '<div style="font-size:11.5px;color:var(--warning);margin-top:6px">⚠ This is a student experience, not verified official policy.</div>' : ''}
      </details>`;
    }).join("") : `<div class="empty-state"><div class="icon-wrap">📘</div>We couldn't find that in your academic memory.</div>`;
  }
  renderKB();
</script>
</body>
</html>
