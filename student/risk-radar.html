<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Academic Risk Radar — Campus Memory</title>
<link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body>
<div id="cm-shell"></div>
<div id="cm-page-content">
  <h1 style="font-size:24px;margin-bottom:2px">Academic Risk Radar</h1>
  <p style="color:var(--text-muted);margin-bottom:22px">An academic planning indicator — not a diagnosis. Based on your real deadlines, attendance and workload data.</p>

  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px" id="risk-cards"></div>
  <div id="risk-detail"></div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ai.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  cmRenderShell({ active: "/student/risk-radar.html", prefix: ".." });

  const upcoming = cmDB().assignments.filter(a => cmDaysUntil(a.deadline) >= 0 && cmDaysUntil(a.deadline) <= 6 && a.status !== "submitted");
  const examsSoon = cmDB().exams.filter(e => cmDaysUntil(e.date+"T00:00:00") >= 0 && cmDaysUntil(e.date+"T00:00:00") <= 10);
  const lowAttendance = cmDB().attendance.subjects.filter(s => s.pct < cmDB().attendance.threshold + 5);
  const pendingCount = cmDB().assignments.filter(a => a.status !== "submitted").length;

  const categories = [
    { key:"deadline", label:"Deadline Risk", icon:"⏰",
      level: upcoming.length >= 3 ? "High" : upcoming.length >= 1 ? "Attention" : "Healthy",
      reason: `${upcoming.length} assignment(s)/exam(s) due within the next 6 days.`,
      items: upcoming.map(a => `${a.title} — due in ${cmDaysUntil(a.deadline)} days`) },
    { key:"attendance", label:"Attendance Risk", icon:"✅",
      level: lowAttendance.length >= 2 ? "High" : lowAttendance.length === 1 ? "Attention" : "Healthy",
      reason: `${lowAttendance.length} subject(s) are within 5% of the ${cmDB().attendance.threshold}% threshold.`,
      items: lowAttendance.map(s => `${cmSubject(s.id).name} — ${s.pct}%`) },
    { key:"exam", label:"Exam Risk", icon:"📝",
      level: examsSoon.length >= 2 ? "High" : examsSoon.length === 1 ? "Attention" : "Healthy",
      reason: `${examsSoon.length} exam(s)/viva(s) scheduled within 10 days.`,
      items: examsSoon.map(e => `${cmSubject(e.subject).name} ${e.type} — ${cmFmtDate(e.date)}`) },
    { key:"workload", label:"Workload Risk", icon:"📊",
      level: pendingCount >= 4 ? "High" : pendingCount >= 2 ? "Attention" : "Healthy",
      reason: `${pendingCount} academic tasks are currently pending across all subjects.`,
      items: cmDB().assignments.filter(a=>a.status!=="submitted").map(a => `${a.title} — ${a.effortHrs}h estimated`) },
  ];
  const levelColor = { High: "danger", Attention: "warning", Healthy: "success" };

  document.getElementById("risk-cards").innerHTML = categories.map(c => `
    <div class="card card-pad card-hover" style="cursor:pointer" onclick="showDetail('${c.key}')">
      <div style="font-size:22px;margin-bottom:8px">${c.icon}</div>
      <div style="font-weight:700;font-size:13.5px;margin-bottom:8px">${c.label}</div>
      <span class="badge badge-${levelColor[c.level]}">${c.level}</span>
    </div>`).join("");

  function showDetail(key){
    const c = categories.find(x => x.key === key);
    document.getElementById("risk-detail").innerHTML = `
      <div class="card card-pad">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <h3 style="font-size:16px">${c.icon} ${c.label.toUpperCase()}</h3>
          <span class="badge badge-${levelColor[c.level]}">${c.level}</span>
        </div>
        <p style="color:var(--text-muted);font-size:14px;margin-bottom:14px">${c.reason}</p>
        ${c.items.length ? `<div>${c.items.map(i => `<div style="padding:10px 0;border-top:1px solid var(--border);font-size:13.5px">${i}</div>`).join("")}</div>` : `<div class="empty-state">Nothing needs attention right now.</div>`}
      </div>`;
  }
  showDetail("deadline");
</script>
</body>
</html>
