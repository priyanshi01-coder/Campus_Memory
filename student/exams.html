<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Exams — Campus Memory</title>
<link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body>
<div id="cm-shell"></div>
<div id="cm-page-content">
  <h1 style="font-size:24px;margin-bottom:2px">Exams</h1>
  <p style="color:var(--text-muted);margin-bottom:20px">Internals, vivas, project reviews and class tests — all in one place.</p>
  <div id="top-exam"></div>
  <h3 style="font-size:15px;margin:26px 0 14px">All upcoming exams</h3>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px" id="exam-grid"></div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ai.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  cmRenderShell({ active: "/student/exams.html", prefix: ".." });
  const sorted = [...cmDB().exams].sort((a,b) => new Date(a.date) - new Date(b.date));
  const next = sorted[0];
  const s = cmSubject(next.subject);
  const days = cmDaysUntil(next.date + "T00:00:00");

  document.getElementById("top-exam").innerHTML = `
    <div class="card card-pad" style="background:linear-gradient(135deg,${s.color}18,transparent);border-color:${s.color}55">
      <div style="font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px">Next up</div>
      <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px">
        <div>
          <h2 style="font-size:26px;margin:0 0 4px">${s.name === next.subject ? next.subject : s.name}</h2>
          <div style="font-size:14px;color:var(--text-muted)">${next.type} · ${cmFmtDate(next.date)} · ${next.time} · ${next.room}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:30px;font-weight:800;color:${s.color}">${days}</div>
          <div style="font-size:11.5px;color:var(--text-muted)">days remaining</div>
        </div>
      </div>
      <div style="margin-top:16px">
        <div class="field-label">Important topics</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${next.topics.map(t=>`<span class="badge badge-neutral">${t}</span>`).join("")}</div>
      </div>
    </div>`;

  document.getElementById("exam-grid").innerHTML = sorted.map(e => {
    const sub = cmSubject(e.subject);
    const d = cmDaysUntil(e.date + "T00:00:00");
    return `<div class="card card-pad card-hover">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span class="badge" style="background:${sub.color}22;color:${sub.color}">${sub.name === e.subject ? e.subject : sub.name}</span>
        <span class="badge badge-neutral">${e.type}</span>
      </div>
      <div style="font-weight:700">${cmFmtDate(e.date)} · ${e.time}</div>
      <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:8px">${e.room} · ${e.faculty}</div>
      <div style="font-size:12px;color:var(--text-muted)">${d} days remaining</div>
    </div>`;
  }).join("");
</script>
</body>
</html>
