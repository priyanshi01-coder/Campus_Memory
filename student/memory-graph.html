<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Campus Memory Graph — Campus Memory</title>
<link rel="stylesheet" href="../assets/css/style.css"/>
<style>
  .graph-node{cursor:pointer;transition:.15s}
  .graph-node:hover circle{filter:brightness(1.15)}
  .graph-node text{pointer-events:none}
  .graph-edge{stroke:var(--border);stroke-width:1.5;transition:.15s}
  .graph-edge.highlight{stroke:var(--accent);stroke-width:2.5}
</style>
</head>
<body>
<div id="cm-shell"></div>
<div id="cm-page-content">
  <h1 style="font-size:24px;margin-bottom:2px">Campus Memory Graph</h1>
  <p style="color:var(--text-muted);margin-bottom:18px">Explore how your academic world is connected.</p>

  <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px">
    <input class="input" style="max-width:260px" id="graph-search" placeholder="Search graph…" oninput="filterGraph(this.value)"/>
    <button class="btn btn-outline btn-sm" onclick="resetGraph()">Reset view</button>
    <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap" id="legend"></div>
  </div>

  <div style="display:grid;grid-template-columns:2fr 1fr;gap:18px;align-items:start">
    <div class="card" style="padding:10px;overflow:hidden">
      <svg id="graph-svg" viewBox="0 0 640 460" style="width:100%;height:520px"></svg>
    </div>
    <div class="card card-pad" id="node-info">
      <div class="empty-state"><div class="icon-wrap">🕸</div>Click a node to explore its connections.</div>
    </div>
  </div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ai.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  cmRenderShell({ active: "/student/memory-graph.html", prefix: ".." });

  const typeColor = { student:"#5B4FCF", subject:"#17B6D4", faculty:"#B8720A", assignment:"#178A4C", event:"#C23B3B", document:"#8B8BA7", topic:"#2A5FC1", exam:"#C23B3B" };
  const typeLabel = { student:"Student", subject:"Subject", faculty:"Faculty", assignment:"Assignment", event:"Event", document:"Document", topic:"Topic", exam:"Exam" };

  document.getElementById("legend").innerHTML = Object.keys(typeLabel).map(t => `<span class="badge" style="background:${typeColor[t]}22;color:${typeColor[t]}">${typeLabel[t]}</span>`).join("");

  // fixed radial layout by ring based on distance from "student"
  const nodes = cmDB().graph.nodes;
  const edges = cmDB().graph.edges;
  const adj = {};
  edges.forEach(([a,b]) => { (adj[a]=adj[a]||[]).push(b); (adj[b]=adj[b]||[]).push(a); });

  const pos = {};
  const center = {x:320,y:230};
  pos["student"] = center;
  const ring1 = nodes.filter(n => edges.some(e => (e[0]==="student"&&e[1]===n.id)||(e[1]==="student"&&e[0]===n.id)));
  ring1.forEach((n,i) => {
    const ang = (i/ring1.length)*2*Math.PI - Math.PI/2;
    pos[n.id] = { x: center.x + 150*Math.cos(ang), y: center.y + 150*Math.sin(ang) };
  });
  const placed = new Set(["student", ...ring1.map(n=>n.id)]);
  const ring2 = nodes.filter(n => !placed.has(n.id));
  ring2.forEach((n,i) => {
    const ang = (i/Math.max(ring2.length,1))*2*Math.PI - Math.PI/2 + 0.3;
    pos[n.id] = { x: center.x + 270*Math.cos(ang), y: center.y + 270*Math.sin(ang) };
  });

  function drawGraph(){
    const svg = document.getElementById("graph-svg");
    let html = "";
    edges.forEach(([a,b]) => {
      if (!pos[a]||!pos[b]) return;
      html += `<line class="graph-edge" id="e-${a}-${b}" x1="${pos[a].x}" y1="${pos[a].y}" x2="${pos[b].x}" y2="${pos[b].y}"/>`;
    });
    nodes.forEach(n => {
      if (!pos[n.id]) return;
      const r = n.id === "student" ? 26 : 20;
      html += `<g class="graph-node" id="n-${n.id}" transform="translate(${pos[n.id].x},${pos[n.id].y})" onclick="selectNode('${n.id}')">
        <circle r="${r}" fill="${typeColor[n.type]}" opacity="0.92"/>
        <text text-anchor="middle" dy="4" font-size="9" font-weight="700" fill="#fff">${n.label.split(" ").map(w=>w[0]).slice(0,2).join("")}</text>
        <text text-anchor="middle" y="${r+14}" font-size="10" font-weight="600" fill="var(--text)">${n.label.length>14?n.label.slice(0,13)+'…':n.label}</text>
      </g>`;
    });
    svg.innerHTML = html;
  }
  drawGraph();

  function selectNode(id){
    document.querySelectorAll(".graph-edge").forEach(e => e.classList.remove("highlight"));
    edges.forEach(([a,b]) => { if (a===id||b===id) { const el=document.getElementById(`e-${a}-${b}`); if(el) el.classList.add("highlight"); } });
    const n = nodes.find(x => x.id === id);
    const conns = (adj[id]||[]).map(cid => nodes.find(x=>x.id===cid)).filter(Boolean);
    document.getElementById("node-info").innerHTML = `
      <div class="badge" style="background:${typeColor[n.type]}22;color:${typeColor[n.type]};margin-bottom:10px">${typeLabel[n.type]}</div>
      <h3 style="font-size:17px;margin-bottom:14px">${n.label}</h3>
      <div class="field-label">Connections</div>
      ${conns.map(c => `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--border)">
        <span style="width:8px;height:8px;border-radius:50%;background:${typeColor[c.type]}"></span>
        <span style="font-size:13px">${c.label}</span>
        <span class="badge badge-neutral" style="margin-left:auto">${typeLabel[c.type]}</span>
      </div>`).join("") || '<div style="font-size:13px;color:var(--text-muted)">No connections found.</div>'}`;
  }
  function resetGraph(){ document.querySelectorAll(".graph-edge").forEach(e=>e.classList.remove("highlight")); document.getElementById("node-info").innerHTML = `<div class="empty-state"><div class="icon-wrap">🕸</div>Click a node to explore its connections.</div>`; }
  function filterGraph(q){
    q = q.toLowerCase();
    nodes.forEach(n => { const el = document.getElementById(`n-${n.id}`); if (el) el.style.opacity = (!q || n.label.toLowerCase().includes(q)) ? "1" : "0.15"; });
  }
  selectNode("student");
</script>
</body>
</html>
