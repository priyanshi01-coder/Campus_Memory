<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Week — Campus Memory</title>
<link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body>
<div id="cm-shell"></div>
<div id="cm-page-content">
  <h1 style="font-size:24px;margin-bottom:2px">My Academic Week</h1>
  <p style="color:var(--text-muted);margin-bottom:20px">Monday through Friday, with workload explained.</p>
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px" id="week-grid"></div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ai.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  cmRenderShell({ active: "/student/week.html", prefix: ".." });
  const dates = ["2026-08-10","2026-08-11","2026-08-12","2026-08-13","2026-08-14"];
  const labels = ["Monday","Tuesday","Wednesday","Thursday","Friday"];
  const loadMeta = [
    {lvl:"Low", color:"success", why:"No deadlines or exams scheduled."},
    {lvl:"Moderate", color:"warning", why:"1 lecture + light reading."},
    {lvl:"Heavy", color:"danger", why:"OS Assignment #2 due + DBMS Viva prep."},
    {lvl:"Heavy", color:"danger", why:"DBMS Viva scheduled today."},
    {lvl:"Heavy", color:"danger", why:"DBMS Assignment #3 due tonight."},
  ];

  document.getElementById("week-grid").innerHTML = dates.map((d,i) => {
    const events = cmDB().timeline.filter(t => t.date === d);
    const exams = cmDB().exams.filter(e => e.date === d);
    return `<div class="card card-pad" style="min-height:280px">
      <div style="font-weight:800;font-size:13px;margin-bottom:2px">${labels[i]}</div>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px">${cmFmtDate(d)}</div>
      <span class="badge badge-${loadMeta[i].color}" style="margin-bottom:10px">${loadMeta[i].lvl} workload</span>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:12px">${loadMeta[i].why}</div>
      ${events.map(t => `<div style="font-size:12px;padding:6px 0;border-top:1px solid var(--border)"><b>${t.time}</b> ${cmSubject(t.subject).name} — ${t.title}</div>`).join("")}
      ${exams.map(e => `<div style="font-size:12px;padding:6px 0;border-top:1px solid var(--border);color:var(--danger)"><b>${e.time}</b> ${cmSubject(e.subject).name} ${e.type}</div>`).join("")}
      ${!events.length && !exams.length ? `<div style="font-size:11.5px;color:var(--text-muted);margin-top:10px">No scheduled academic events.</div>` : ""}
    </div>`;
  }).join("");
</script>
</body>
</html>
