<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>What Did I Miss? — Campus Memory</title>
<link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body>
<div id="cm-shell"></div>
<div id="cm-page-content">
  <h1 style="font-size:26px;margin-bottom:2px">What did I miss?</h1>
  <p style="color:var(--text-muted);margin-bottom:22px">Tell us when you were away. We'll reconstruct your academic timeline.</p>

  <div class="card card-pad" style="margin-bottom:24px;max-width:560px">
    <div style="display:flex;gap:14px;align-items:end">
      <div style="flex:1"><label class="field-label">From</label><input type="date" class="input" id="from-date" value="2026-08-05" min="2026-07-01" max="2026-08-08"/></div>
      <div style="flex:1"><label class="field-label">To</label><input type="date" class="input" id="to-date" value="2026-08-07" min="2026-07-01" max="2026-08-08"/></div>
    </div>
    <button class="btn btn-primary" style="width:100%;margin-top:16px" onclick="reconstruct()">Reconstruct My Academic Memory</button>
  </div>

  <div id="loading" style="display:none;text-align:center;padding:50px 0;color:var(--text-muted)">
    <div style="font-size:30px;margin-bottom:10px">🧠</div>
    <div id="loading-text" style="font-weight:600">Searching your academic memory…</div>
  </div>

  <div id="results"></div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ai.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  cmRenderShell({ active: "/student/what-did-i-miss.html", prefix: ".." });

  const typeIcon = { Lecture: "🎓", Assignment: "📄", Exam: "📝", Notes: "🗒️", Deadline: "⏰", Attendance: "✅" };
  const steps = ["Searching your academic memory…","Gathering events from your subjects…","Cross-referencing deadlines…","Building your summary…"];

  function reconstruct(){
    const from = document.getElementById("from-date").value;
    const to = document.getElementById("to-date").value;
    if (!from || !to || from > to) { cmToast("Please choose a valid date range", "error"); return; }

    document.getElementById("results").innerHTML = "";
    document.getElementById("loading").style.display = "block";
    let i = 0;
    const iv = setInterval(() => {
      document.getElementById("loading-text").textContent = steps[i % steps.length];
      i++;
    }, 450);

    setTimeout(() => {
      clearInterval(iv);
      document.getElementById("loading").style.display = "none";
      renderSummary(from, to);
    }, 1800);
  }

  function renderSummary(from, to){
    const items = cmDB().timeline.filter(t => t.date >= from && t.date <= to);
    const groups = {};
    items.forEach(t => (groups[t.date] = groups[t.date] || []).push(t));

    const urgent = cmDB().assignments.filter(a => cmDaysUntil(a.deadline) >= 0 && cmDaysUntil(a.deadline) <= 7 && a.status !== "submitted");

    let html = `<h2 style="font-size:18px;margin-bottom:16px">Your Absence Summary — ${cmFmtDate(from)} to ${cmFmtDate(to)}</h2>`;

    if (!Object.keys(groups).length) {
      html += `<div class="empty-state"><div class="icon-wrap">🔎</div>Nothing academically significant was recorded in this range.</div>`;
    } else {
      html += Object.keys(groups).sort().map(date => {
        const bySubject = {};
        groups[date].forEach(t => (bySubject[t.subject] = bySubject[t.subject] || []).push(t));
        return `<div class="card card-pad" style="margin-bottom:16px">
          <div style="font-weight:800;margin-bottom:12px">${new Date(date+"T00:00:00").toLocaleDateString("en-IN",{weekday:"long"})} — ${cmFmtDate(date)}</div>
          ${Object.keys(bySubject).map(sid => {
            const s = cmSubject(sid);
            return `<div style="margin-bottom:12px;padding-left:12px;border-left:3px solid ${s.color}">
              <div style="font-weight:700;font-size:13.5px;margin-bottom:4px">${s.name}</div>
              ${bySubject[sid].map(t => `<div style="font-size:13px;color:var(--text-muted)">${t.type==='Deadline'?'⚠':'✓'} ${t.title}</div>`).join("")}
            </div>`;
          }).join("")}
        </div>`;
      }).join("");
    }

    html += `<div class="card card-pad" style="border-color:var(--warning);background:var(--warning-soft)">
      <div style="font-weight:800;margin-bottom:8px">⚠ IMPORTANT — YOU SHOULD KNOW</div>
      ${urgent.length ? urgent.map(a => `<div style="font-size:13.5px;margin-bottom:4px">Your <b>${a.title}</b> (${cmSubject(a.subject).name}) is due ${cmFmtDate(a.deadline)}.</div>`).join("") : `<div style="font-size:13.5px">No urgent deadlines fall right after this period.</div>`}
    </div>`;

    document.getElementById("results").innerHTML = html;
    cmToast("Academic memory reconstructed");
  }
</script>
</body>
</html>
