<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Class Memory — Campus Memory</title>
<link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body>
<div id="cm-shell"></div>
<div id="cm-page-content">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:4px">
    <h1 style="font-size:24px">DBMS Class Memory</h1>
    <select class="input" style="width:auto" id="subj-select" onchange="cmToast('Class Memory is available for DBMS in this demo')">
      <option>DBMS</option><option>Data Structures</option><option>Operating Systems</option>
    </select>
  </div>
  <p style="color:var(--text-muted);margin-bottom:22px">What your class has learned, struggled with, and discovered.</p>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px" id="cm-grid"></div>

  <div class="card card-pad" style="margin-top:20px;text-align:center">
    <p style="color:var(--text-muted);font-size:13.5px;margin-bottom:10px">Have something worth remembering for future batches?</p>
    <button class="btn btn-primary" onclick="cmToast('Contribution submitted for moderation')">Contribute to Class Memory</button>
  </div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ai.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  cmRenderShell({ active: "/student/class-memory.html", prefix: ".." });
  const cmMem = cmDB().classMemory.dbms;

  document.getElementById("cm-grid").innerHTML = `
    <div class="card card-pad">
      <div style="font-weight:800;margin-bottom:12px">Frequently Difficult Topics <span class="badge badge-neutral" style="margin-left:6px">Historical observation</span></div>
      ${cmMem.difficultTopics.map(t => `
        <div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>${t.topic}</span><b>${t.pct}%</b></div>
          <div class="progress-track"><div class="progress-fill" style="width:${t.pct}%;background:var(--warning)"></div></div>
        </div>`).join("")}
    </div>
    <div class="card card-pad">
      <div style="font-weight:800;margin-bottom:12px">Frequently Asked Questions <span class="badge badge-neutral" style="margin-left:6px">Student submitted</span></div>
      ${cmMem.faq.map(q => `<details style="margin-bottom:8px;padding:10px 12px;background:var(--surface-2);border-radius:8px"><summary style="cursor:pointer;font-weight:600;font-size:13.5px">${q}</summary><div style="margin-top:8px;font-size:12.5px;color:var(--text-muted)">Discussed in class and among students — see subject notes for the full explanation.</div></details>`).join("")}
    </div>
    <div class="card card-pad">
      <div style="font-weight:800;margin-bottom:12px">Faculty-Marked Important Topics <span class="badge badge-info" style="margin-left:6px">Faculty verified</span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${cmMem.facultyImportant.map(t => `<span class="badge badge-accent">⭐ ${t}</span>`).join("")}</div>
    </div>
    <div class="card card-pad">
      <div style="font-weight:800;margin-bottom:12px">Historical Exam Pattern <span class="badge badge-neutral" style="margin-left:6px">Historical observation</span></div>
      ${cmMem.examPattern.map(p => `<div style="display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--border);font-size:13px"><span>${p.unit}</span><span class="badge ${p.freq==='Frequently asked'?'badge-danger':'badge-warning'}">${p.freq}</span></div>`).join("")}
    </div>`;
</script>
</body>
</html>
