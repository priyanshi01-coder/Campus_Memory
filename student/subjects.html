<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Subjects — Campus Memory</title>
<link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body>
<div id="cm-shell"></div>
<div id="cm-page-content">
  <h1 style="font-size:24px;margin-bottom:2px">Subjects</h1>
  <p style="color:var(--text-muted);margin-bottom:20px">Each subject is its own academic hub.</p>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px" id="subj-grid"></div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ai.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  cmRenderShell({ active: "/student/subjects.html", prefix: ".." });
  document.getElementById("subj-grid").innerHTML = cmDB().subjects.map(s => {
    const att = cmDB().attendance.subjects.find(a => a.id === s.id);
    const pendingA = cmDB().assignments.filter(a => a.subject === s.id && a.status !== "submitted").length;
    return `<div class="card card-pad card-hover" style="border-top:4px solid ${s.color}">
      <div style="font-weight:800;font-size:16px;margin-bottom:2px">${s.name}</div>
      <div style="font-size:12.5px;color:var(--text-muted);margin-bottom:12px">${s.faculty}</div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">Current: ${s.unit}</div>
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-top:10px">
        <span>Attendance</span><b>${att?att.pct:"-"}%</b>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-top:4px">
        <span>Pending assignments</span><b>${pendingA}</b>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <a href="./class-memory.html" class="btn btn-outline btn-sm" style="flex:1">Class Memory</a>
        <a href="./assignments.html" class="btn btn-outline btn-sm" style="flex:1">Assignments</a>
      </div>
    </div>`;
  }).join("");
</script>
</body>
</html>
