<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Academic Calendar — Campus Memory</title>
<link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body>
<div id="cm-shell"></div>
<div id="cm-page-content">
  <h1 style="font-size:24px;margin-bottom:20px">Academic Calendar</h1>
  <div id="cal-list"></div>
</div>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ai.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  cmRenderShell({ active: "/admin/calendar.html", prefix: ".." });
  const events = [...cmDB().exams.map(e=>({date:e.date,label:`${cmSubject(e.subject).name} — ${e.type}`,type:"Exam"})),
    ...cmDB().assignments.map(a=>({date:a.deadline.slice(0,10),label:`${a.title} due`,type:"Deadline"}))].sort((a,b)=>new Date(a.date)-new Date(b.date));
  document.getElementById("cal-list").innerHTML = events.map(e => `
    <div class="card card-pad card-hover" style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">
      <div><div style="font-weight:700;font-size:13.5px">${e.label}</div><div style="font-size:12px;color:var(--text-muted)">${cmFmtDate(e.date)}</div></div>
      <span class="badge badge-neutral">${e.type}</span>
    </div>`).join("");
</script>
</body>
</html>
