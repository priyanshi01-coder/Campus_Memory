<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Departments — Campus Memory</title>
<link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body>
<div id="cm-shell"></div>
<div id="cm-page-content">
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:20px">
    <div><h1 style="font-size:24px;margin-bottom:2px">Departments</h1><p style="color:var(--text-muted)">Add, edit or remove departments.</p></div>
    <button class="btn btn-primary" onclick="openForm()">+ Add Department</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px" id="grid"></div>
</div>

<div id="modal" class="overlay" style="display:none" onclick="if(event.target===this) closeForm()">
  <div class="modal">
    <div style="padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
      <b id="modal-title">Add Department</b><button class="btn btn-ghost btn-sm" onclick="closeForm()">✕</button>
    </div>
    <div style="padding:20px">
      <label class="field-label">Department name</label><input class="input" id="f-name" style="margin-bottom:12px"/>
      <label class="field-label">Students</label><input class="input" id="f-students" type="number" style="margin-bottom:12px" value="0"/>
      <label class="field-label">Faculty</label><input class="input" id="f-faculty" type="number" style="margin-bottom:12px" value="0"/>
      <input type="hidden" id="f-id"/>
      <button class="btn btn-primary" style="width:100%" onclick="saveDept()">Save Department</button>
    </div>
  </div>
</div>

<script src="../assets/js/store.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ai.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  cmRenderShell({ active: "/admin/departments.html", prefix: ".." });

  function render(){
    document.getElementById("grid").innerHTML = cmList("departments").map(d => `
      <div class="card card-pad card-hover">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div style="font-weight:800;font-size:16px;margin-bottom:8px">${d.name}</div>
          <div style="display:flex;gap:6px">
            <button class="icon-btn" onclick="editDept('${d.id}')">✎</button>
            <button class="icon-btn danger" onclick="deleteDept('${d.id}')">🗑</button>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>Students</span><b>${d.students}</b></div>
        <div style="display:flex;justify-content:space-between;font-size:13px"><span>Faculty</span><b>${d.faculty}</b></div>
      </div>`).join("") || `<div class="empty-state" style="grid-column:1/-1">No departments yet.</div>`;
  }
  function openForm(){
    document.getElementById("modal-title").textContent = "Add Department";
    ["f-name","f-id"].forEach(id => document.getElementById(id).value = "");
    document.getElementById("f-students").value = 0; document.getElementById("f-faculty").value = 0;
    document.getElementById("modal").style.display = "flex";
  }
  function editDept(id){
    const d = cmGet("departments", id);
    document.getElementById("modal-title").textContent = "Edit Department";
    document.getElementById("f-id").value = d.id;
    document.getElementById("f-name").value = d.name;
    document.getElementById("f-students").value = d.students;
    document.getElementById("f-faculty").value = d.faculty;
    document.getElementById("modal").style.display = "flex";
  }
  function closeForm(){ document.getElementById("modal").style.display = "none"; }
  function saveDept(){
    const id = document.getElementById("f-id").value;
    const name = document.getElementById("f-name").value.trim();
    const students = parseInt(document.getElementById("f-students").value) || 0;
    const faculty = parseInt(document.getElementById("f-faculty").value) || 0;
    if (!name) { cmToast("Name is required", "error"); return; }
    if (id) { cmUpdate("departments", id, { name, students, faculty }); cmToast("Department updated"); }
    else { cmAdd("departments", { name, students, faculty }); cmToast("Department added"); }
    closeForm(); render();
  }
  function deleteDept(id){
    if (!confirm("Remove this department? This cannot be undone.")) return;
    cmRemove("departments", id); cmToast("Department removed"); render();
  }
  render();
</script>
</body>
</html>
