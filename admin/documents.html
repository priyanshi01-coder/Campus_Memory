<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Documents — Campus Memory</title>
<link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body>
<div id="cm-shell"></div>
<div id="cm-page-content">
  <h1 style="font-size:24px;margin-bottom:20px">Document Center</h1>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px" id="grid"></div>
</div>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ai.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  cmRenderShell({ active: "/admin/documents.html", prefix: ".." });
  document.getElementById("grid").innerHTML = cmDB().documents.map(d => {
    const s = cmSubject(d.subject);
    return `<div class="card card-pad card-hover">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:20px">📄</span>
        <span class="badge ${d.status==='published'?'badge-success':'badge-warning'}">${d.status==='published'?'Published':'Pending review'}</span>
      </div>
      <div style="font-weight:700;font-size:13.5px">${d.title}</div>
      <div style="font-size:12px;color:var(--text-muted);margin:6px 0">${s.name} · ${d.uploadedBy} · ${cmFmtDate(d.date)}</div>
      ${d.aiExtracted ? '<span class="badge badge-accent">✦ AI Extracted</span>' : ''}
      <div style="display:flex;gap:8px;margin-top:12px"><button class="btn btn-outline btn-sm" style="flex:1" onclick="cmToast('Opening document…')">View</button><button class="btn btn-outline btn-sm" style="flex:1" onclick="cmToast('Downloading…')">Download</button></div>
    </div>`;
  }).join("");
</script>
</body>
</html>
