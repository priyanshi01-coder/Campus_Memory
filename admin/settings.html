<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Settings — Campus Memory</title>
<link rel="stylesheet" href="../assets/css/style.css"/>
</head>
<body>
<div id="cm-shell"></div>
<div id="cm-page-content">
  <h1 style="font-size:24px;margin-bottom:20px">Settings</h1>
  <div class="card card-pad" style="margin-bottom:16px">
    <div class="field-label" style="margin-bottom:10px">Notifications</div>
    <label style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13.5px"><span>Verification queue alerts</span><input type="checkbox" checked/></label>
    <label style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13.5px"><span>System activity digests</span><input type="checkbox" checked/></label>
  </div>
  <div class="card card-pad" style="border-color:var(--danger)">
    <div class="field-label" style="margin-bottom:10px;color:var(--danger)">Danger zone</div>
    <button class="btn btn-sm" style="background:var(--danger-soft);color:var(--danger)" onclick="resetAll()">Reset local demo data</button>
  </div>
</div>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/ai.js"></script>
<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
  cmRenderShell({ active: "/admin/settings.html", prefix: ".." });
  function resetAll(){
    if (!confirm("Reset all local demo data and sign out? This cannot be undone.")) return;
    cmResetDB(); window.location.href = "../login.html";
  }
</script>
</body>
</html>
